name: Coverage badge

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'

defaults:
  run:
    shell: bash

jobs:
  coverage:
    name: Coverage run
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run coverage
        run: |
          uv run --with coverage coverage run --data-file=.coverage -m pytest .

      - name: Create JSON report
        run: |
          uv run --with coverage coverage json -i
          export TOTAL=$(uv run python -c "import json;print(json.load(open('coverage.json'))['totals']['percent_covered_display'])")
          echo "total=$TOTAL" >> $GITHUB_ENV
          echo "### Total coverage: ${TOTAL}%" >> $GITHUB_STEP_SUMMARY

      - name: Make badge
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          # GIST_TOKEN is a GitHub personal access token with scope "gist".
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: b3aed92d981188c2152a987aaf5e566b
          filename: pebbledoc_coverage.json
          label: Coverage
          labelColor: "#31393f"
          namedLogo: pytest
          logoColor: "#959da5"
          message: ${{ env.total }}%
          minColorRange: 50
          maxColorRange: 95
          valColorRange: ${{ env.total }}
