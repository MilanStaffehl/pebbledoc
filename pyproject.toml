[project]
name = "minidoc-md"
version = "0.1.0"
description = "Lightweight API documentation generator for GitHub markdown."
readme = "README.md"
authors = [
    { name = "Milan Staffehl" }
]
requires-python = ">=3.13"
dependencies = [
    "docutils>=0.23",
]
keywords = [
    "documentation",
    "docs",
    "rst",
    "rest",
    "restructuredtext",
    "markdown",
    "github-markdown",
]

# build system
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyrefly>=1.1.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]

# urls
[project.urls]
Github = "https://github.com/MilanStaffehl/minidoc-md"
Homepage = "https://github.com/MilanStaffehl/minidoc-md"
Issues = "https://github.com/MilanStaffehl/minidoc-md/issues"

# entry points
[project.scripts]
minidoc-md = "minidoc_md.cli:main"


# tools
[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C901", "RUF100", "RUF101", "RUF200"]

[tool.ruff.lint.pycodestyle]
max-line-length = 88

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.isort]
src_paths = ["src/minidoc_md", "tests"]
known_first_party = ["minidoc_md"]
line_length = 79
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true

[tool.pyrefly]
project-includes = ["**/*.py*"]
project-excludes = [
    "**/node_modules",
    "**/__pycache__",
    "**/*venv/**",
    "**/.[!/.]*/**",
]
use-ignore-files = true
search-path = ["src", "tests/acceptance/resources", "tests"]
python-version = "3.13"
