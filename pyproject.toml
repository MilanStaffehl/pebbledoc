[project]
name = "minidoc-md"
version = "0.1.0"
description = "Lightweight API documentation generator for GitHub markdown."
readme = "README.md"
authors = [
    { name = "Milan Staffehl", email = "milan-staffehl@gmx.de" }
]
requires-python = ">=3.13"
dependencies = [
    "docutils>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyrefly>=1.1.1",
    "pytest>=9.1.1",
]


# tools
[tool.pyrefly]
project-includes = ["**/*.py*"]
project-excludes = [
    "**/node_modules",
    "**/__pycache__",
    "**/*venv/**",
    "**/.[!/.]*/**",
]
use-ignore-files = true
search-path = ["src"]
python-version = "3.13"
